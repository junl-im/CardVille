name: 라니팡 Firebase 정식 사이트 배포
on:
  push:
    branches: [main]
    paths:
      - ops/firebase-live-release.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lanypang-cardville-firebase-live
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact production release request
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const r=JSON.parse(fs.readFileSync('ops/firebase-live-release.json','utf8'));
          const f=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          const v=JSON.parse(fs.readFileSync('web/version.json','utf8'));
          assert.equal(r.projectId,'cardville');
          assert.equal(r.channelId,'live');
          assert.equal(r.release,'2.3.52-beta');
          assert.equal(v.version,r.release);
          assert.equal(f.projects.default,'cardville');
          assert.equal(r.site,'cardville');
          console.log('정식 배포 승인 설정 검사: PASS');
          NODE
          node tools/check-release.cjs
          node tools/check-korean-ui.cjs
          node tools/check-korean-complete.cjs
          node tools/check-lany-shell.cjs
          node tools/check-world-map.cjs
          node tools/check-v09.cjs
          node tools/check-map-touch.cjs
          node tools/check-friends-mobile.cjs
          node tools/check-tempo.cjs
          node tools/check-polish.cjs
          node tools/check-gameplay-v12.cjs
          node tools/check-specials-v35.cjs
          node tools/check-special-combos-v69.cjs
          node tools/check-input-balance-v70.cjs
          node tools/check-go-input-v71.cjs
          node tools/check-special-footprint-v72.cjs
          node tools/check-match-time-stars-v73.cjs
          node tools/check-result-guard-v74.cjs
          node tools/check-asset-paths-v74.cjs
          node tools/check-hard-mode-v40.cjs
          node tools/check-hard-frenzy-v41.cjs
          node tools/check-hard-visual-v42.cjs
          node tools/check-mode-world-v43.cjs
          node tools/check-mode-game-v44.cjs
          node tools/check-precache-assets-v44.cjs
          node tools/check-illustrated-buttons-v61.cjs
          node tools/check-layout-polish-v62.cjs
          node tools/check-control-rims-v63.cjs
          node tools/check-map-connect-v45.cjs
          node tools/check-map-reliability-v46.cjs
          node tools/check-pages-v13.cjs
          node tools/check-pwa-v14.cjs
          node tools/check-art-buttons-v15.cjs
          node tools/check-action-art-v16.cjs
          node tools/check-title-stage-v17.cjs
          node tools/check-update-version.cjs
          node tools/check-visual-perf-v18.cjs
          node tools/check-longplay-v19.cjs
          node tools/check-v20-cache-map.cjs
          node tools/check-ui-v21.cjs
          node tools/check-raster-only-v22.cjs
          node tools/check-v24-restore.cjs
          node tools/check-progress-migration.cjs
          node tools/check-firebase-preview.cjs
      - name: Confirm matching project service-account ID (no secret output)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDVILLE }}
          CARDVILLE_REQUIRE_SAME_PROJECT: '1'
        run: |
          test -n "$FIREBASE_SA" || { echo 'Firebase Secret이 필요합니다'; exit 1; }
          node tools/check-iam-identity.cjs
      - name: Render matching favicon, home-screen and maskable app icons
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python tools/build-pwa-icons.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet Pillow==11.3.0
          python tools/build-visual-v18.py
          node tools/check-visual-perf-v18.cjs --raster
          node tools/check-v20-cache-map.cjs --raster
          node tools/check-ui-v21.cjs --raster
          node tools/check-pwa-v14.cjs --raster
      - name: Deploy actual Firebase Hosting live site
        id: live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDVILLE }}
          projectId: cardville
          channelId: live
      - name: HTTP checks for actual public game
        shell: bash
        run: |
          set -euo pipefail
          url='https://cardville.web.app'
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --location --max-time 25 "$url/?v=2.3.52" -o /tmp/lany-live.html && \
              grep -Fq '<html lang="ko">' /tmp/lany-live.html && \
              grep -Fq '라니팡!' /tmp/lany-live.html && \
              grep -Fq 'lany-polish.js?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-v24-restore.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-polish.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-install.js?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-art-buttons.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-user-art-v26.css?v=6' /tmp/lany-live.html && \
              grep -Fq 'lany-compact-ui-v27.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-result-polish-v28.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-screen-polish-v29.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-mobile-layout-v30.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-control-polish-v31.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-design-polish-v33.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-puzzle-aqua-v34.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-gameplay-v35.css?v=1' /tmp/lany-live.html && \
              grep -Fq 'lany-action-art-v16.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-title-stage-v17.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-raster-v18.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-result-v19.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-worlds-v20.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-ui-v21.css?v=2.3.52' /tmp/lany-live.html && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v30/boosters/hammer.webp" -o /tmp/lany-v30-hammer.webp && test "$(wc -c </tmp/lany-v30-hammer.webp)" -gt 10000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v28/results/panel-win.webp" -o /tmp/lany-v28-win.webp && test "$(wc -c </tmp/lany-v28-win.webp)" -gt 10000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v28/results/panel-lose.webp" -o /tmp/lany-v28-lose.webp && test "$(wc -c </tmp/lany-v28-lose.webp)" -gt 10000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v24/animals/cat-black.webp" -o /tmp/lany-live-blackcat.webp && test "$(wc -c </tmp/lany-live-blackcat.webp)" -gt 700 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v24/regions/tab-10.webp" -o /tmp/lany-live-world10.webp && test "$(wc -c </tmp/lany-live-world10.webp)" -gt 700 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/ui/v21/buttons/skin-green.webp" -o /tmp/lany-v21-skin.webp && test "$(wc -c </tmp/lany-v21-skin.webp)" -gt 500 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/map/stage-current-v20.webp" -o /tmp/lany-map-current-v20.webp && test "$(wc -c </tmp/lany-map-current-v20.webp)" -gt 700 && \
              grep -Fq 'lany-layout-polish-v62.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-control-rims-v63.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-control-fit-v64.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-visual-calm-v65.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-match-joy-v66.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-quiet-hint-v67.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-game-feel-v68.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-readability-combos-v69.css?v=2.3.52' /tmp/lany-live.html && \
              grep -Fq 'lany-results-recovery-v70.css?v=2.3.52' /tmp/lany-live.html && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v62/animals/cat-fierce.png" -o /tmp/lany-v62-cat.png && test "$(wc -c </tmp/lany-v62-cat.png)" -gt 10000 && \
              grep -Fq 'lany-perf-v19.js?v=2.3.52' /tmp/lany-live.html && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/ui/v21/title/play.webp" -o /tmp/btn-play-v21.webp && test "$(wc -c </tmp/btn-play-v21.webp)" -gt 1000 && \
              grep -Fq 'lany-update-v17.js?v=2.3.52' /tmp/lany-live.html && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/ui/v21/title/logo.webp" -o /tmp/lany-raster-check-title-forest-v17.webp && test "$(wc -c </tmp/lany-raster-check-title-forest-v17.webp)" -gt 500 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/ui/v21/buttons/action-resume.webp" -o /tmp/lany-raster-check-action-resume.webp && test "$(wc -c </tmp/lany-raster-check-action-resume.webp)" -gt 500 && \
              grep -Fq 'assets/v26/title/logo.webp' /tmp/lany-live.html && \
              grep -Fq 'assets/v26/title/start.webp' /tmp/lany-live.html && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v26/title/logo.webp" -o /tmp/lany-v26-logo.webp && test "$(wc -c </tmp/lany-v26-logo.webp)" -gt 10000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v26/regions/tab-10.webp" -o /tmp/lany-v26-region10.webp && test "$(wc -c </tmp/lany-v26-region10.webp)" -gt 10000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/v26/actions/prep-start.webp" -o /tmp/lany-v26-prep.webp && test "$(wc -c </tmp/lany-v26-prep.webp)" -gt 10000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/ui/v21/title/play.webp" -o /tmp/lany-raster-check-title-play.webp && test "$(wc -c </tmp/lany-raster-check-title-play.webp)" -gt 500 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/lanypang-icon-512.png" -o /tmp/lany-launch.png && \
              test "$(wc -c </tmp/lany-launch.png)" -gt 1000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/assets/polish/rabbit-wink.webp" -o /tmp/lany-wink.webp && \
              test "$(wc -c </tmp/lany-wink.webp)" -gt 1000 && \
              curl --fail --silent --show-error --location --max-time 25 "$url/js/lany-polish.js" -o /tmp/lany-polish-source.js && grep -Fq 'LanyPolish' /tmp/lany-polish-source.js; then
              echo '라니팡 Firebase LIVE HTTP/asset test: PASS'
              echo '## 라니팡 실제 Firebase 정식 게임 배포 성공' >> "$GITHUB_STEP_SUMMARY"
              echo '- 정식 게임 URL: https://cardville.web.app/?v=2.3.52' >> "$GITHUB_STEP_SUMMARY"
              echo '- 단일 공식 주소: https://cardville.web.app/' >> "$GITHUB_STEP_SUMMARY"
              echo "- 배포 커밋: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              echo '- 원본 데이터 및 Firestore/Auth 변경 없음' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 8
          done
          echo 'LIVE deployment attempted but site HTTP test did not pass' >&2
          exit 1
