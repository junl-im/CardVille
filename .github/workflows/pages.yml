name: CardVille Match-3 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cardville-match3-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static game and safety checks
        run: |
          set -e
          node tools/check-release.cjs
          node tools/check-korean-ui.cjs
          node tools/check-korean-complete.cjs
          node tools/check-lany-shell.cjs
          node tools/check-world-map.cjs
          node tools/check-v09.cjs
          node tools/check-map-touch.cjs
          node tools/check-friends-mobile.cjs
          node tools/check-polish.cjs
          node tools/check-gameplay-v12.cjs
          node tools/check-pages-v13.cjs
          node tools/check-pwa-v14.cjs
          node tools/check-tempo.cjs
          test -f web/index.html
          test -f web/LICENSE
          test -f web/sw.js
          test -f web/version.json
      - name: Render matching favicon, home-screen and maskable app icons
        run: |
          python -m pip install --quiet CairoSVG==2.7.1
          python tools/build-pwa-icons.py
          node tools/check-pwa-v14.cjs --raster
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
