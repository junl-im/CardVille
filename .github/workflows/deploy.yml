name: Deploy CardVille to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cardville-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify and build
        run: npm run verify

      - name: Write deploy proof
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > dist/deploy-proof.html <<HTML
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CardVille ${VERSION} Deploy Proof</title><style>body{margin:0;background:#071126;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,90vw);padding:24px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}</style></head><body><main class="box"><h1>CardVille Deploy OK</h1><p>version: <b>${VERSION}</b></p><p>run: ${GITHUB_RUN_ID}</p><p><a style="color:#8fd3ff" href="/CardVille/">게임 열기</a></p></main></body></html>
          HTML
          cat > dist/version.json <<JSON
          {"name":"CardVille","version":"${VERSION}","runId":"${GITHUB_RUN_ID}","sha":"${GITHUB_SHA}"}
          JSON
          echo 'dist root:'
          find dist -maxdepth 1 -type f -exec basename {} \; | sort
          echo 'dist assets:'
          if [ -d dist/assets ]; then find dist/assets -maxdepth 1 -type f -exec basename {} \; | sort | head -30; fi

      - name: Validate Pages artifact input
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/deploy-proof.html
          if find dist -type l -print -quit | grep -q .; then
            echo 'Pages artifact must not contain symbolic links.' >&2
            exit 1
          fi
          BYTES=$(du -sb dist | cut -f1)
          FILES=$(find dist -type f | wc -l | tr -d ' ')
          echo "dist bytes: ${BYTES}"
          echo "dist files: ${FILES}"
          if [ "${BYTES}" -ge 1000000000 ]; then
            echo 'Pages artifact is too large for the supported 1GB deployment target.' >&2
            exit 1
          fi
          if [ "${FILES}" -gt 10000 ]; then
            echo 'Pages artifact has an unexpectedly high file count.' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist
          retention-days: 1
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy_primary.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy_primary
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages

      - name: Wait before retrying Pages deploy
        if: ${{ steps.deploy_primary.outcome == 'failure' }}
        run: sleep 45

      - name: Retry GitHub Pages deploy
        id: deploy_retry
        if: ${{ steps.deploy_primary.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Print URL
        run: echo "${{ steps.deploy_retry.outputs.page_url || steps.deploy_primary.outputs.page_url }}"
