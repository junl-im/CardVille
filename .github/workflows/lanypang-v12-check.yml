name: LanyPang Gameplay and Mobile QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate game logic, visuals, mobile and saved progress
        run: |
          set -euo pipefail
          node tools/check-release.cjs
          node tools/check-korean-ui.cjs
          node tools/check-korean-complete.cjs
          node tools/check-lany-shell.cjs
          node tools/check-world-map.cjs
          node tools/check-map-reliability-v46.cjs
          node tools/check-v09.cjs
          node tools/check-map-touch.cjs
          node tools/check-friends-mobile.cjs
          node tools/check-polish.cjs
          node tools/check-tempo.cjs
          node tools/check-gameplay-v12.cjs
          node tools/check-specials-v35.cjs
          node tools/check-pages-v13.cjs
          node tools/check-pwa-v14.cjs
          node tools/check-art-buttons-v15.cjs
          node tools/check-action-art-v16.cjs
          node tools/check-title-stage-v17.cjs
          node tools/check-update-version.cjs
          node tools/check-visual-perf-v18.cjs
          node tools/check-longplay-v19.cjs
          node tools/check-v20-cache-map.cjs
          node tools/check-ui-v21.cjs
          node tools/check-raster-only-v22.cjs
          node tools/check-art-v23.cjs
          node tools/check-v24-restore.cjs
          node tools/check-layout-polish-v62.cjs
          node tools/check-control-rims-v63.cjs
          node tools/check-progress-migration.cjs
          node tools/check-canonical-redirect.cjs

  browser-pages:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser QA
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium firefox webkit
          python -m pip install --quiet Pillow==11.3.0
          python tools/build-pwa-icons.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet Pillow==11.3.0
          python tools/build-visual-v18.py
          node tools/check-visual-perf-v18.cjs --raster
          node tools/check-v20-cache-map.cjs --raster
          node tools/check-ui-v21.cjs --raster
          node tools/check-pwa-v14.cjs --raster
      - name: Validate actual mobile and desktop page navigation
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory web > /tmp/lanypang-http.log 2>&1 &
          sleep 2
          python tests/verify-paging-v13.py
          python tests/verify-pwa-v14.py
          python tests/verify-art-buttons-v15.py
          python tests/verify-action-art-v16.py
          python tests/verify-title-stage-v17.py
          python tests/verify-v18-perf.py
          python tests/verify-longplay-v19.py
          python tests/verify-v20-offline-map.py
          python tests/verify-ui-v21.py
          python tests/verify-raster-v22.py
          python tests/verify-all-windows-v22.py
          python tests/verify-browser-exit-v57.py
      - name: Preserve comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanypang-v21-premium-webp-all-screens
          path: |
            docs/paging-v13/*.png
            docs/art-buttons-v15/*.png
            docs/action-art-v16/*.png
            docs/title-stage-v17/*.png
            docs/raster-v22/*.png
            docs/all-windows-v22/*.png
            docs/v18-perf/*.png
            docs/longplay-v19/*.png
            docs/v20-offline-map/*.png
            docs/ui-v21/*.png
          if-no-files-found: ignore
